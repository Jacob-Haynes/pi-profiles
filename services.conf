# ISTAR demo kit service catalogue (read by switch.sh, the launcher and bootstrap.sh)
#
# unit               port  class   repo               title
#
# class:
#   always  never stopped by a switch (the launcher itself)
#   core    platform services (OTS, mesh bridge); kept up between demo profiles
#   light   small CPU footprint
#   medium  steady DSP or ML load (audio, SDR, image diff)
#   camera  live-video YOLO; at most ONE camera unit per profile
#   mac     runs on a Mac station only (never on the Pi); listed so the launcher can name it
#
# port "-" means no web UI. opentakserver's UI is nginx on port 80.
# drone-detector moved from 8080 to 8060 (contract v3): OTS's nginx owns 8080 (Marti API).
# It reads WEB_PORT from /etc/drone-detector.env. If you change it, change it here too.
isr-launcher         8050  always  pi-profiles        Launcher
isr-maps             8160  always  pi-profiles        Offline maps (ATAK basemaps)
opentakserver        80    core    -                  OpenTAKServer
mesh-bridge          8170  core    blufor-tracker     Mesh-TAK bridge
mesh-deadrop         8070  light   mesh-deadrop       Mesh dead drop
drone-detector       8060  light   drone-detector     Wi-Fi drone detector
tac-advisor          8090  light   tac-advisor        Tactical advisor
acoustic-detector    8100  medium  acoustic-detector  Acoustic detector
fpv-vision           8110  camera  fpv-vision         FPV vision (YOLO)
op-sentry            8120  camera  op-sentry          OP sentry (360 / YOLO)
op-sentry-stream     8120  camera  op-sentry          OP camera stream (Pi to Mac, split mode)
change-detect        8130  medium  change-detect      Change detection
rf-spectrum          8140  medium  rf-spectrum        RF spectrum
photoAnalysis        8150  mac     photoAnalysis      Geo-locate (photo geolocation)
