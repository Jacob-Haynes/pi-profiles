# Fallback with no Macs: the Pi runs everything it can on its own (one camera-YOLO tool per Pi, so no FPV video)
# @title Pi only (fallback: no Macs)
# @devices heltec-v3, usb-mic, 360-camera
# @optional alfa-wifi, rtl-sdr
# @note No Macs: the AI is Gemini when the venue has internet (sudo isr-set-gemini-key), else the offline templates. Highest CPU load: watch the launcher's temperature and throttling readout and use active cooling.
