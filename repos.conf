# Repos bootstrap.sh installs, and the branch it checks out for each.
# Override per run:  sudo ./bootstrap.sh --branch fpv-vision=main
# If a branch is missing on GitHub, bootstrap falls back to the repo's default
# branch and marks it "fallback" in the summary.
#
# The 4th column says where the repo runs. "pi" (default) is installed by bootstrap.sh on the Pi;
# "mac" means Mac stations only (laptop/setup-mac.sh), so bootstrap and the /etc env helpers skip it.
#
# visibility mirrors GitHub. Private repos need gh auth or --token-file/--ssh (see README).
# Final state: op-sentry and photoAnalysis are private; everything else is public.
# (fpv-vision and change-detect are AGPL-3.0 and briefly stay private until that relicence lands;
# until then bootstrap reports "no access" for them without gh auth.)
#
# repo               branch                    visibility  where
blufor-tracker       feature/fit-for-purpose   public
drone-detector       feature/fit-for-purpose   public
tac-advisor          feature/fit-for-purpose   public
mesh-deadrop         feature/fit-for-purpose   public
acoustic-detector    feature/initial           public
fpv-vision           feature/initial           public
op-sentry            feature/initial           private
change-detect        feature/initial           public
rf-spectrum          feature/initial           public
photoAnalysis        feature/isr-kit           private      mac
